name: glowmatch
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.1
  mime: ^2.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/glowmatch_icon.png"
  adaptive_icon_background: "#F6F0FF"
  adaptive_icon_foreground: "assets/branding/glowmatch_icon.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/branding/glowmatch_icon.png"
    background_color: "#F6F0FF"
    theme_color: "#7C3AED"

flutter_native_splash:
  color: "#18002E"
  color_dark: "#18002E"

  android: true
  ios: true
  web: true

  android_12:
    color: "#18002E"
    color_dark: "#18002E"
    image: assets/branding/glowmatch_icon.png
    image_dark: assets/branding/glowmatch_icon.png